[package]
name = "cmd-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
dialoguer = "0.11"
colored = "3"
